<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BasketWise emails</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css"><link rel="icon" href="icon-192.png"></head>
<body><main class="wrap" style="max-width:560px;padding-top:40px;padding-bottom:48px">
<p><a href="./">← BasketWise</a></p>
<div class="card"><h1 style="font-size:1.4rem;margin-top:0" id="t">One moment…</h1><p id="m" class="hint"></p></div>
</main>
<script src="config.js"></script>
<script>
"use strict";
(async () => {
  const cfg = window.BW_CONFIG || {}, q = new URLSearchParams(location.search);
  const action = q.get("action"), token = q.get("t") || "";
  const t = document.getElementById("t"), m = document.getElementById("m");
  const fn = { confirm: "confirm_subscription", unsubscribe: "unsubscribe" }[action];
  if (!fn || !/^[0-9a-f-]{36}$/i.test(token) || !cfg.supabaseUrl) { t.textContent = "This link isn't valid"; m.textContent = "It may be incomplete. Please use the link from your most recent email."; return; }
  try {
    const r = await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${fn}`, { method: "POST",
      headers: { apikey: cfg.supabaseAnonKey, Authorization: `Bearer ${cfg.supabaseAnonKey}`, "Content-Type": "application/json" },
      body: JSON.stringify({ token }) });
    const ok = r.ok && (await r.json()) === true;
    if (action === "confirm") { t.textContent = ok ? "You're subscribed ✅" : "Link expired or already used"; m.textContent = ok ? "You'll get the BasketWise weekly prices update. Every email has a one-click unsubscribe link." : "If you meant to subscribe, please sign up again on BasketWise."; }
    else { t.textContent = "You're unsubscribed"; m.textContent = "You won't get any more BasketWise update emails. Your email address has been deleted from our list."; }
  } catch { t.textContent = "Something went wrong"; m.textContent = "Please try the link again in a few minutes."; }
})();
</script>
</body></html>
