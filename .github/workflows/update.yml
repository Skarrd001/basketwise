name: Update prices and deploy

# Two halves:
#   scrape  - runs on YOUR computer (a "self-hosted runner"). Checkers/Shoprite block GitHub's
#             datacenter servers, but serve an ordinary home internet connection.
#   publish - runs on GitHub's free servers: builds the site from the committed data and deploys it.
# If your computer is off, scrape waits in the queue (up to 24h) and the site keeps yesterday's prices.
#
# SECURITY: a self-hosted runner executes this repo's workflow code on your PC. This workflow has no
# pull_request trigger, so strangers can't run code on it. Keep it that way, and in
# Settings -> Actions -> General, require approval for workflows from outside contributors.

on:
  schedule:
    # 04:20 UTC = 06:20 SAST, every day. Inside PnP's robots.txt visit window (04:00-08:45 UTC).
    - cron: "20 4 * * *"
  # App/page changes publish straight away on GitHub's servers, without waiting for the PC to scrape.
  push:
    branches: [main]
    paths: ["site/**", "scraper/build_pages.py", "data/prices.json", "scraper/index_basket.json"]
  workflow_dispatch:
    inputs:
      stores:
        description: "Refresh store locations (normally Mondays)"
        type: boolean
        default: false
      publish_only:
        description: "Just rebuild and publish the site from saved data (no scraping, PC not needed)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push' && !inputs.publish_only
    runs-on: [self-hosted, basketwise]
    timeout-minutes: 300
    env:
      PYTHONUTF8: "1"   # Windows defaults to cp1252; product names include characters like É and ×
    steps:
      - uses: actions/checkout@v4

      # Uses the Python installed on your PC (actions/setup-python can't install Python when the
      # runner is a Windows service). Every step below is a plain command that works in PowerShell too.
      - run: python -m pip install -q -r scraper/requirements.txt

      - name: Decide weekly jobs
        id: plan
        env:
          IN_STORES: ${{ inputs.stores }}
        run: python scraper/ci.py plan

      - name: Refresh store locations (Mondays)
        if: steps.plan.outputs.stores == 'true'
        working-directory: scraper
        continue-on-error: true
        timeout-minutes: 15
        run: python stores.py

      - name: Fetch today's prices
        id: prices
        working-directory: scraper
        run: python run.py
        continue-on-error: true
        # Checkers + Shoprite take ~15 min; Pick n Pay then runs until its robots.txt window closes
        # (08:45 UTC) or its budget is used, saving progress every 5 minutes.
        timeout-minutes: 250
        env:
          BASKETWISE_BUDGET_MIN: "60"
          BASKETWISE_PNP_BUDGET_MIN: "220"

      - name: Data-quality tests
        # only checks that guard the data; page-generation problems are handled at publish time
        run: python -m unittest -v tests.test_parsers tests.test_catalogue

      - name: Commit data
        run: python scraper/ci.py commit

      - name: Fail loudly if a retailer broke
        if: steps.prices.outcome == 'failure'
        run: python scraper/ci.py fail "A retailer stopped returning prices. See the 'Fetch today's prices' log."

  publish:
    needs: scrape
    # Publish even if scraping failed or never ran (PC off): the site then shows the last good data.
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the data commit the scrape job just pushed

      - name: Build site
        shell: bash
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/prices.json _site/data/
          [ -f data/trends.json ] && cp data/trends.json _site/data/ || true
          [ -f data/stores.json ] && cp data/stores.json _site/data/ || true

      - name: Build SEO product pages, weekly post and sitemap
        continue-on-error: true   # a page-generation problem must never block publishing the app
        run: |
          python3 -m pip install -q pillow
          python3 scraper/build_pages.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
