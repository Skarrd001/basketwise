name: Update prices and deploy

on:
  schedule:
    # 04:20 UTC = 06:20 SAST, every day. Inside PnP's robots.txt visit window (04:00-08:45 UTC).
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Re-run product matching (normally Sundays)"
        type: boolean
        default: false
      stores:
        description: "Refresh store locations (normally Mondays)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Decide weekly jobs
        id: plan
        run: |
          dow=$(date -u +%u)   # 1=Mon .. 7=Sun
          stores=false; discover=false
          { [ "$dow" = 1 ] || [ ! -f data/stores.json ] || [ "${{ inputs.stores }}" = true ]; } && stores=true
          { [ "$dow" = 7 ] || [ "${{ inputs.discover }}" = true ]; } && discover=true
          echo "stores=$stores" >> "$GITHUB_OUTPUT"
          echo "discover=$discover" >> "$GITHUB_OUTPUT"

      - name: Refresh store locations (Mondays)
        if: steps.plan.outputs.stores == 'true'
        working-directory: scraper
        continue-on-error: true
        timeout-minutes: 15
        run: python stores.py

      - name: Re-match products (Sundays)
        if: steps.plan.outputs.discover == 'true'
        working-directory: scraper
        continue-on-error: true
        timeout-minutes: 40
        env:
          BASKETWISE_BUDGET_MIN: "35"
        run: python discover.py

      - name: Fetch today's prices
        id: prices
        working-directory: scraper
        run: python run.py
        continue-on-error: true
        timeout-minutes: 50
        env:
          BASKETWISE_BUDGET_MIN: "40"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Commit data
        run: |
          git config user.name "basketwise-bot"
          git config user.email "basketwise-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: prices $(date -u +%F)"
          git push

      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          mkdir -p _site/data
          cp data/prices.json _site/data/
          [ -f data/trends.json ] && cp data/trends.json _site/data/ || true
          [ -f data/stores.json ] && cp data/stores.json _site/data/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Fail loudly if a retailer broke
        if: steps.prices.outcome == 'failure'
        run: |
          echo "::error::A retailer stopped returning prices. See the 'Fetch today's prices' log."
          exit 1

  deploy:
    needs: scrape
    if: always() && needs.scrape.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
