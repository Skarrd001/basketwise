name: Update prices and deploy

# Two halves:
#   scrape  - runs on YOUR computer (a "self-hosted runner"). Checkers/Shoprite block GitHub's
#             datacenter servers, but serve an ordinary home internet connection.
#   publish - runs on GitHub's free servers: builds the site from the committed data and deploys it.
# If your computer is off, scrape waits in the queue (up to 24h) and the site keeps yesterday's prices.
#
# SECURITY: a self-hosted runner executes this repo's workflow code on your PC. This workflow has no
# pull_request trigger, so strangers can't run code on it. Keep it that way, and in
# Settings -> Actions -> General, require approval for workflows from outside contributors.

on:
  schedule:
    # Hourly at :20. GitHub's scheduler is unreliable (runs arrive hours late or not at all), so it gets
    # many chances; a scheduled run skips itself once today's prices are saved (scraper/ci.py plan).
    # Pick n Pay is only crawled 06:00-10:45 SAST (its robots.txt), so morning runs matter most.
    - cron: "20 * * * *"
  # App/page changes publish straight away on GitHub's servers, without waiting for the PC to scrape.
  push:
    branches: [main]
    paths: ["site/**", "scraper/build_pages.py", "data/prices.json", "scraper/index_basket.json"]
  workflow_dispatch:
    inputs:
      stores:
        description: "Refresh store locations (normally Mondays)"
        type: boolean
        default: false
      auto:
        description: "Started by the PC's daily timer: skip work already done today (like a scheduled run)"
        type: boolean
        default: false
      publish_only:
        description: "Just rebuild and publish the site from saved data (no scraping, PC not needed)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push' && !inputs.publish_only
    runs-on: [self-hosted, basketwise]
    timeout-minutes: 300
    env:
      PYTHONUTF8: "1"   # Windows defaults to cp1252; product names include characters like É and ×
    steps:
      - uses: actions/checkout@v4

      # Uses the Python installed on your PC (actions/setup-python can't install Python when the
      # runner is a Windows service). Every step below is a plain command that works in PowerShell too.
      - run: python -m pip install -q -r scraper/requirements.txt

      - name: Decide weekly jobs
        id: plan
        env:
          IN_STORES: ${{ inputs.stores }}
          IN_AUTO: ${{ inputs.auto }}
        run: python scraper/ci.py plan

      - name: Refresh store locations (Mondays)
        if: steps.plan.outputs.stores == 'true'
        working-directory: scraper
        continue-on-error: true
        timeout-minutes: 15
        run: python stores.py

      # Step 1: Checkers + Shoprite (+ SPAR/Woolworths checks), saved straight away (~15 min).
      - name: Prices - Checkers and Shoprite
        id: cs
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.cs_done != 'true'
        working-directory: scraper
        run: python run.py --no-pnp
        continue-on-error: true
        timeout-minutes: 60
        env:
          BASKETWISE_BUDGET_MIN: "45"

      - name: Data-quality tests (step 1)
        if: steps.cs.outcome == 'success' || steps.cs.outcome == 'failure'
        id: test1
        run: python -m unittest -v tests.test_parsers tests.test_catalogue tests.test_ci

      - name: Save Checkers and Shoprite
        if: steps.test1.outcome == 'success'
        continue-on-error: true
        run: python scraper/ci.py commit

      # Step 2: Pick n Pay, only inside its robots.txt window (06:00-10:45 SAST); saved separately, so a PC
      # that drops off here loses only this step. Its matches are also saved locally every 5 minutes.
      - name: Prices - Pick n Pay
        id: pnp
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.pnp_needed == 'true'
        working-directory: scraper
        run: python run.py --pnp-only
        continue-on-error: true
        timeout-minutes: 250
        env:
          BASKETWISE_PNP_BUDGET_MIN: "220"

      - name: Data-quality tests (step 2)
        if: steps.pnp.outcome == 'success' || steps.pnp.outcome == 'failure'
        id: test2
        run: python -m unittest -v tests.test_parsers tests.test_catalogue tests.test_ci

      - name: Save Pick n Pay
        if: steps.test2.outcome == 'success'
        run: python scraper/ci.py commit

      - name: Fail loudly if a retailer broke
        if: steps.cs.outcome == 'failure' || steps.pnp.outcome == 'failure'
        run: python scraper/ci.py fail "A retailer stopped returning prices. See the price steps' logs."

  publish:
    needs: scrape
    # Publish even if scraping failed or never ran (PC off): the site then shows the last good data.
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the data commit the scrape job just pushed

      - name: Build site
        shell: bash
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/prices.json _site/data/
          [ -f data/trends.json ] && cp data/trends.json _site/data/ || true
          [ -f data/stores.json ] && cp data/stores.json _site/data/ || true

      - name: Build SEO product pages, weekly post and sitemap
        continue-on-error: true   # a page-generation problem must never block publishing the app
        run: |
          python3 -m pip install -q pillow
          python3 scraper/build_pages.py _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
